[build-system]
requires = ["setuptools>=68", "wheel>=0.41"]
build-backend = "setuptools.build_meta"

[project]
name = "devseat-cognitive-guard"
version = "1.0.0+public.1"
description = "Model-agnostic context and LLM execution optimization"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
context-reduce = "devseat_cognitive_guard.context_cli:main"
context-pleum-bench = "devseat_cognitive_guard.pleum_benchmark:main"
context-hybrid-bench = "devseat_cognitive_guard.hybrid_benchmark:main"
context-baseline-bench = "devseat_cognitive_guard.baseline_benchmark:main"
context-agentic-bench = "devseat_cognitive_guard.agentic_benchmark:main"
context-execution-bench = "devseat_cognitive_guard.execution_benchmark:main"
context-runtime-bench = "devseat_cognitive_guard.runtime_benchmark:main"
context-bridge = "devseat_cognitive_guard.bridge:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
